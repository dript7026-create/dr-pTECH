apply plugin: 'com.android.application'

android {
    namespace 'com.driptech.kaijugaiden'
    compileSdkVersion 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.driptech.kaijugaiden'
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-21'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../../../skazka_terranova_c/third_party/SDL/android-project/app/src/main/java'
            ]
            res.srcDirs = ['src/main/res']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}